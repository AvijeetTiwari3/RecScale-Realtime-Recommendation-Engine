version: '3.8'

services:
  recscale-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.recsys
    container_name: recscale-server
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  redis-store:
    image: redis:alpine
    container_name: recscale-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: recscale-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    restart: unless-stopped
